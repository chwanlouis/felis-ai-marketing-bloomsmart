<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 — Felis AI 工作區</title>
    <link rel="apple-touch-icon" href="$app_icon_url">
    <link rel="icon" type="image/jpeg" href="$app_icon_url">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Felis AI">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        $critical_css
    </style>
</head>
<body class="auth-wrapper">
    <div class="auth-card">
        <h1>登入 Felis AI</h1>
        $error_block
        <form action="/login" method="POST">
            <label for="identifier">帳號、電郵地址或手機號碼</label>
            <input type="text" id="identifier" name="identifier" placeholder="帳號 / name@example.com / +85212345678" required autofocus>

            <label for="password">密碼</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn-blue" style="width:100%;">登入系統</button>
        </form>
        <a href="/register" class="btn btn-green" style="display:block; width:100%; box-sizing:border-box; text-align:center; margin-top:12px;">註冊新帳戶</a>
    </div>
</body>
</html>
